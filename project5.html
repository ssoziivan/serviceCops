<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="main7.css">
    <script src="PasswordStrength/password.js"></script>
    <title>Form With Password Strength</title>
</head>
<body>
    <header>
        <h1>Password Strength</h1>
    </header>
    <main>
        <form class="form-group" method="POST">
            <img src="images/profile-img.png" alt="Profile-img">

            <div class="input-box">
                <label for="username">Username:</label>
                <span><i class="fa fa-user-o" aria-hidden="false"></i></span>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="input-box">
                <label for="email">Email:</label>
                <span><i class="fa fa-envelope-o" aria-hidden="false"></i> </span>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="input-box">
                <label for="password">Password:</label>
                <span><i class="fa fa-key" aria-hidden="false"></i> </span>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <input type="checkbox" name="checkbox" value="detail" id="option-1">
            <label for="option-1">Remember me</label>
            <br><br>
            <button type="submit"><i class="fa fa-sign-in"></i> LOGIN</button>
            <a href="#" class="forget">Forgot Password</a>
            
            <span><i class="fa fa-google" aria-hidden="true"></i></span>
        </form>
    </main>
    <script type="text/javascript">
        $(function(){
            $("#password").passwordStrength();
        });
    </script>
</body>
</html>
